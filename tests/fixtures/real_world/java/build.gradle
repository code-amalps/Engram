plugins {
    id 'java'
}

group = 'com.engram.billing'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:3.2.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
}

test {
    useJUnitPlatform()
}
