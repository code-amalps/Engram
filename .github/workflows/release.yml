name: Release & Distribution Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and test only, do not publish release)'
        required: false
        default: true
        type: boolean
      attestation_policy:
        description: 'Attestation policy (required | approved_without_attestation)'
        required: false
        default: 'required'
        type: choice
        options:
          - 'required'
          - 'approved_without_attestation'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: engram.exe
            archive_format: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_name: engram
            archive_format: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: engram
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: engram
            archive_format: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test built binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          echo "Smoke testing: $BIN"
          chmod +x "$BIN" || true

          # 1. Mach-O architecture and format verification for macOS binaries
          if [[ "${{ matrix.target }}" == *"apple-darwin"* ]]; then
            echo "Inspecting Mach-O binary headers..."
            file "$BIN"
            lipo -info "$BIN"
            if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]]; then
              file "$BIN" | grep -q "x86_64" || { echo "Error: Expected x86_64 Mach-O binary"; exit 1; }
            elif [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
              file "$BIN" | grep -q "arm64" || { echo "Error: Expected arm64 Mach-O binary"; exit 1; }
            fi
          fi

          # 2. Execution test (Native, or under arch -x86_64 / Rosetta emulation)
          CAN_EXECUTE=false
          EXEC_PREFIX=""
          if "$BIN" --version >/dev/null 2>&1; then
            CAN_EXECUTE=true
          elif command -v arch >/dev/null 2>&1 && arch -x86_64 "$BIN" --version >/dev/null 2>&1; then
            EXEC_PREFIX="arch -x86_64 "
            CAN_EXECUTE=true
          fi

          if [ "$CAN_EXECUTE" = true ]; then
            echo "Executing functional smoke test via: ${EXEC_PREFIX}${BIN}"
            ${EXEC_PREFIX}"$BIN" --version
            TMP_DIR=$(mktemp -d 2>/dev/null || mktemp -d -t 'engram_smoke_XXXXXX')
            echo "Testing init, analyze, and bench in $TMP_DIR"
            ${EXEC_PREFIX}"$BIN" --root "$TMP_DIR" init
            ${EXEC_PREFIX}"$BIN" --root "$TMP_DIR" analyze
            ${EXEC_PREFIX}"$BIN" --root "$TMP_DIR" bench
            rm -rf "$TMP_DIR"
            echo "Smoke test PASSED ✓"
          else
            echo "Host architecture ($(uname -m)) cannot directly execute target (${{ matrix.target }})."
            echo "Performing deep binary verification via otool and size inspection..."
            otool -hv "$BIN"
            otool -L "$BIN"
            BIN_SIZE=$(wc -c < "$BIN" | tr -d ' ')
            echo "Binary size: $BIN_SIZE bytes"
            if [ "$BIN_SIZE" -lt 1000000 ]; then
              echo "Error: Binary size ($BIN_SIZE bytes) is suspiciously small (< 1MB)"
              exit 1
            fi
            echo "Binary structure and linkage verification PASSED ✓"
          fi

      - name: Package archive (Windows ZIP)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          $ArchiveName = "engram-$Tag-${{ matrix.target }}.zip"
          $StageDir = "dist_staging_${{ matrix.target }}"
          New-Item -ItemType Directory -Path $StageDir -Force | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination $StageDir
          Copy-Item "README.md" -Destination $StageDir
          Copy-Item "LICENSE" -Destination $StageDir
          
          Compress-Archive -Path "$StageDir/*" -DestinationPath $ArchiveName -Force
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -FilePath "$ArchiveName.sha256" -Encoding ascii
          Write-Host "Created $ArchiveName ($Hash)"

      - name: Package archive (Unix TAR.GZ)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          ARCHIVE_NAME="engram-${TAG}-${{ matrix.target }}.tar.gz"
          STAGE_DIR="dist_staging_${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$STAGE_DIR/"
          cp "README.md" "$STAGE_DIR/"
          cp "LICENSE" "$STAGE_DIR/"
          
          tar -czf "$ARCHIVE_NAME" -C "$STAGE_DIR" .
          
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi
          echo "Created $ARCHIVE_NAME ($(cat "${ARCHIVE_NAME}.sha256"))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            engram-${{ github.ref_name }}-${{ matrix.target }}.*

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: binary-*
          merge-multiple: true

      - name: Generate unified SHA256SUMS and release-manifest.json
        run: |
          cd release_assets
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          echo "─── Unified SHA256SUMS ───"
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

          # Generate structured release manifest
          python3 -c "
          import json, os, glob, hashlib, datetime

          manifest = {
              'version': '${{ github.ref_name }}'.lstrip('v'),
              'tag': '${{ github.ref_name }}',
              'commit_sha': '${{ github.sha }}',
              'build_time': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'repository': '${{ github.repository }}',
              'supported_targets': [
                  'x86_64-pc-windows-msvc',
                  'x86_64-unknown-linux-musl',
                  'x86_64-apple-darwin',
                  'aarch64-apple-darwin'
              ],
              'unsupported_targets': [
                  {'target': 'aarch64-unknown-linux-musl', 'reason': 'Scheduled for post-v1.4.0 cross-toolchain qualification'},
                  {'target': 'aarch64-pc-windows-msvc', 'reason': 'Windows ARM64 requires dedicated MSVC cross-runner'}
              ],
              'artifacts': []
          }

          for f in sorted(glob.glob('engram-*')):
              if f.endswith('.zip') or f.endswith('.tar.gz'):
                  with open(f, 'rb') as fp:
                      h = hashlib.sha256(fp.read()).hexdigest()
                  manifest['artifacts'].append({
                      'filename': f,
                      'sha256': h,
                      'size_bytes': os.path.getsize(f)
                  })

          with open('release-manifest.json', 'w', encoding='utf-8') as out:
              json.dump(manifest, out, indent=2)
          print('Generated release-manifest.json ✓')
          "
          cat release-manifest.json

      - name: Resolve and Validate Attestation Policy
        id: policy
        run: |
          POLICY="${{ inputs.attestation_policy || vars.ATTESTATION_POLICY || 'required' }}"
          echo "Resolved attestation policy: $POLICY"
          if [ "$POLICY" = "required" ]; then
            echo "run_attestation=true" >> "$GITHUB_OUTPUT"
          elif [ "$POLICY" = "approved_without_attestation" ]; then
            echo "run_attestation=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Attestation step bypassed under approved_without_attestation policy."
          else
            echo "::error::Invalid attestation policy '$POLICY'. Allowed values: 'required', 'approved_without_attestation'."
            exit 1
          fi

      - name: Attest Build Provenance
        if: steps.policy.outputs.run_attestation == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release_assets/engram-*'

      - name: Record Attestation Audit Disclosure
        if: steps.policy.outputs.run_attestation == 'false'
        run: |
          echo "Release published without Sigstore provenance attestations pursuant to explicit operator authorization for private repository." >> release_assets/ATTESTATION_DISCLOSURE.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Engram ${{ github.ref_name }}
          files: |
            release_assets/*
            install.ps1
            install.sh
          body: |
            # 🧠 Engram ${{ github.ref_name }}

            Persistent engineering memory and change intelligence for AI coding agents.

            ### 📦 Multi-Platform Standalone Binaries
            - **Windows (x86_64):** `engram-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip`
            - **Linux (x86_64 musl):** `engram-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz`
            - **macOS Intel (x86_64):** `engram-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz`
            - **macOS Apple Silicon (arm64):** `engram-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz`

            ---

            ### 🚀 1-Click Installation

            **Windows (PowerShell):**
            ```powershell
            iwr -useb https://raw.githubusercontent.com/code-amalps/Engram/main/install.ps1 | iex
            ```

            **Linux & macOS (Bash / Sh):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/code-amalps/Engram/main/install.sh | sh
            ```

            ---

            ### 🚀 Highlights & Capabilities
            - **7 Supported Languages:** Native Tree-sitter parsers for Rust, Go, TypeScript, JavaScript, Python, C#, and Java (Maven/Gradle).
            - **Change Contracts & Change Guard:** Prevents AI coding agents from making unintended edits outside their task scope.
            - **Stateful Automated Recovery (`engram recover`):** Bounded repair directives (max 2 attempts) without directly altering code.
            - **Architectural Drift & Decay (`engram drift`):** Scoped staleness tracking commits touching governed code since explicit ratification.
            - **Two-Tier Incremental Engine:** Authoritative content hash with fast-path hint (>6× warm analysis speedup).
            - **Local Execution:** 100% local, zero outbound network telemetry, SQLite WAL storage.
            - **MCP Server:** 1-click configuration for Cursor, Claude Desktop, and Windsurf (`engram setup cursor`).

            ---

            ### 🔒 Integrity & Verification
            All binary archives are cryptographically verified with `SHA256SUMS` included in the release assets.
          draft: false
          prerelease: false
