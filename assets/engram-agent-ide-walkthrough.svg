<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0b0e14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="agent-bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="mcp-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Window Frame -->
  <g filter="url(#card-shadow)" transform="translate(20, 20)">
    <rect width="1060" height="640" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect width="1060" height="38" rx="10" fill="url(#header-grad)"/>
    <rect width="1060" height="1" y="38" fill="#30363d"/>

    <!-- Window Dots (Mac style) -->
    <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="56" cy="19" r="6" fill="#27c93f"/>

    <!-- Window Title -->
    <text x="530" y="24" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="500">Cursor IDE — my-backend-service (Connected to Engram MCP Server)</text>

    <!-- MAIN BODY: 3-PANE LAYOUT -->

    <!-- PANE 1: Project Explorer (Left, width: 220) -->
    <g transform="translate(0, 39)">
      <rect width="210" height="601" fill="#0d1117"/>
      <rect width="1" height="601" x="210" fill="#30363d"/>

      <text x="18" y="24" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="1">PROJECT EXPLORER</text>

      <!-- Folder Structure -->
      <g transform="translate(18, 44)" font-family="monospace" font-size="12">
        <text x="0" y="0" fill="#c9d1d9">▼ my-backend-service/</text>

        <!-- .engram folder (Highlighted) -->
        <rect x="12" y="10" width="170" height="78" rx="4" fill="#1f6feb" fill-opacity="0.1" stroke="#388bfd" stroke-opacity="0.4"/>
        <text x="16" y="26" fill="#58a6ff" font-weight="bold">▼ .engram/</text>
        <text x="32" y="44" fill="#7ee787">constitution.yaml</text>
        <text x="32" y="62" fill="#7ee787">memory.yaml</text>
        <text x="32" y="80" fill="#8b949e">index.db (sqlite)</text>

        <!-- src folder -->
        <text x="16" y="108" fill="#c9d1d9">▼ src/</text>
        <rect x="28" y="116" width="140" height="20" rx="3" fill="#30363d"/>
        <text x="32" y="130" fill="#f0f6fc">📄 billing.rs</text>
        <text x="32" y="152" fill="#8b949e">📄 auth.rs</text>
        <text x="32" y="174" fill="#8b949e">📄 main.rs</text>
        <text x="16" y="196" fill="#f85149">🔒 secrets/vault.rs</text>

        <!-- Configs -->
        <text x="16" y="226" fill="#8b949e">▼ .cursor/</text>
        <text x="32" y="246" fill="#d2a8ff">mcp.json</text>
        <text x="16" y="274" fill="#8b949e">📄 .cursorrules</text>
        <text x="16" y="296" fill="#8b949e">📄 Cargo.toml</text>
      </g>

      <!-- Bottom Status Pill in Sidebar -->
      <g transform="translate(14, 550)">
        <rect width="182" height="36" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.2"/>
        <circle cx="16" cy="18" r="5" fill="#3fb950"/>
        <text x="30" y="16" fill="#3fb950" font-size="11" font-weight="600">Engram MCP Active</text>
        <text x="30" y="29" fill="#8b949e" font-size="9.5">stdio: 9 tools registered</text>
      </g>
    </g>

    <!-- PANE 2: Code Editor (Middle, width: 380) -->
    <g transform="translate(211, 39)">
      <rect width="390" height="601" fill="#161b22"/>
      <rect width="1" height="601" x="390" fill="#30363d"/>

      <!-- Tab Bar -->
      <rect width="390" height="32" fill="#0d1117"/>
      <rect width="130" height="32" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="20" y="21" fill="#f0f6fc" font-size="12">billing.rs</text>
      <circle cx="118" cy="16" r="3" fill="#388bfd"/>

      <!-- Code Content -->
      <g transform="translate(16, 50)" font-family="monospace" font-size="11.5" line-height="1.5">
        <text x="0" y="0" fill="#8b949e">1</text> <text x="24" y="0" fill="#ff7b72">use</text> <text x="50" y="0" fill="#c9d1d9">crate::errors::Result;</text>
        <text x="0" y="20" fill="#8b949e">2</text>
        <text x="0" y="40" fill="#8b949e">3</text> <text x="24" y="40" fill="#ff7b72">pub struct</text> <text x="96" y="40" fill="#79c0ff">BillingService</text> <text x="180" y="40" fill="#c9d1d9">{</text>
        <text x="0" y="60" fill="#8b949e">4</text> <text x="44" y="60" fill="#c9d1d9">gateway: Arc&lt;PaymentGateway&gt;,</text>
        <text x="0" y="80" fill="#8b949e">5</text> <text x="24" y="80" fill="#c9d1d9">}</text>
        <text x="0" y="100" fill="#8b949e">6</text>
        <text x="0" y="120" fill="#8b949e">7</text> <text x="24" y="120" fill="#ff7b72">impl</text> <text x="56" y="120" fill="#79c0ff">BillingService</text> <text x="140" y="120" fill="#c9d1d9">{</text>

        <!-- Highlighted Change block (written by agent) -->
        <rect x="20" y="132" width="356" height="106" rx="4" fill="#238636" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.5"/>
        <text x="0" y="148" fill="#3fb950">8+</text> <text x="32" y="148" fill="#8b949e">// Implemented under Change Contract ctr_829104</text>
        <text x="0" y="168" fill="#3fb950">9+</text> <text x="32" y="168" fill="#ff7b72">pub fn</text> <text x="76" y="168" fill="#d2a8ff">issue_refund</text><text x="156" y="168" fill="#c9d1d9">(&amp;self, id: &amp;str) -&gt; Result&lt;()&gt; {</text>
        <text x="0" y="188" fill="#3fb950">10+</text> <text x="48" y="188" fill="#79c0ff">audit_event!</text><text x="130" y="188" fill="#c9d1d9">("refund", id);</text>
        <text x="0" y="208" fill="#3fb950">11+</text> <text x="48" y="208" fill="#c9d1d9">self.gateway.refund(id)</text>
        <text x="0" y="228" fill="#3fb950">12+</text> <text x="32" y="228" fill="#c9d1d9">}</text>

        <text x="0" y="254" fill="#8b949e">13</text> <text x="24" y="254" fill="#c9d1d9">}</text>
      </g>

      <!-- Terminal at bottom of editor -->
      <g transform="translate(10, 430)">
        <rect width="370" height="156" rx="6" fill="#0d1117" stroke="#30363d"/>
        <rect width="370" height="24" rx="6" fill="#161b22"/>
        <text x="12" y="16" fill="#8b949e" font-family="monospace" font-size="10">TERMINAL — Git Pre-Commit Guard</text>

        <g transform="translate(12, 42)" font-family="monospace" font-size="10.5">
          <text x="0" y="0" fill="#79c0ff">$ git add src/billing.rs &amp;&amp; git commit -m "feat: refund"</text>
          <text x="0" y="20" fill="#d2a8ff">[engram guard] Evaluating staged diff vs Contract ctr_829104</text>
          <text x="0" y="40" fill="#c9d1d9">• Expected files: [src/billing.rs] — OK</text>
          <text x="0" y="60" fill="#c9d1d9">• Forbidden zones: [secrets/**] — 0 violations</text>
          <text x="0" y="80" fill="#3fb950" font-weight="bold">✅ PASS: Commit approved. (Exit code 0)</text>
          <text x="0" y="100" fill="#8b949e">[main c4f92a1] feat: refund capability added</text>
        </g>
      </g>
    </g>

    <!-- PANE 3: AI Coding Agent Chat (Right, width: 458) -->
    <g transform="translate(602, 39)">
      <rect width="458" height="601" fill="#0d1117"/>

      <!-- Chat Header -->
      <rect width="458" height="32" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="18" y="21" fill="#d2a8ff" font-size="12" font-weight="600">✨ Cursor Composer (AI Coding Agent)</text>

      <!-- Chat Stream -->
      <g transform="translate(14, 46)">

        <!-- 1. Developer Prompt Bubble -->
        <rect width="430" height="42" rx="6" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd" stroke-opacity="0.4"/>
        <text x="12" y="18" fill="#58a6ff" font-size="10" font-weight="600">DEVELOPER PROMPT:</text>
        <text x="12" y="32" fill="#f0f6fc" font-size="12">"Add refund capability to BillingService"</text>

        <!-- 2. Agent Action 1: Preflight MCP -->
        <g transform="translate(0, 52)">
          <rect width="430" height="58" rx="6" fill="#161b22" stroke="#30363d"/>
          <rect x="8" y="8" width="132" height="18" rx="3" fill="url(#mcp-badge-grad)" stroke="#8957e5" stroke-opacity="0.5"/>
          <text x="14" y="21" fill="#d2a8ff" font-size="9.5" font-family="monospace">MCP: engram_analyze_task</text>
          <text x="148" y="21" fill="#8b949e" font-size="10">Task: "Add refund capability..."</text>
          <text x="12" y="44" fill="#c9d1d9" font-size="11">✓ Parsed AST (4 methods in <tspan fill="#79c0ff">src/billing.rs</tspan>)</text>
          <text x="240" y="44" fill="#7ee787" font-size="11">✓ Rule: "Refunds emit audit logs"</text>
        </g>

        <!-- 3. Agent Action 2: Change Contract Lock -->
        <g transform="translate(0, 118)">
          <rect width="430" height="58" rx="6" fill="#161b22" stroke="#30363d"/>
          <rect x="8" y="8" width="186" height="18" rx="3" fill="url(#mcp-badge-grad)" stroke="#8957e5" stroke-opacity="0.5"/>
          <text x="14" y="21" fill="#d2a8ff" font-size="9.5" font-family="monospace">MCP: engram_create_change_contract</text>
          <text x="12" y="44" fill="#c9d1d9" font-size="11">🔒 Locked Contract <tspan fill="#e3b341" font-weight="bold">ctr_829104</tspan> (Allowed: <tspan fill="#79c0ff">src/billing.rs</tspan>, Forbidden: <tspan fill="#f85149">secrets/**</tspan>)</text>
        </g>

        <!-- 4. Agent Action 3: Code Modification -->
        <g transform="translate(0, 184)">
          <rect width="430" height="42" rx="6" fill="#161b22" stroke="#30363d"/>
          <text x="12" y="18" fill="#e3b341" font-size="10" font-weight="600">AGENT CODE GENERATION:</text>
          <text x="12" y="32" fill="#c9d1d9" font-size="11">Modified <tspan fill="#79c0ff">src/billing.rs</tspan> — implemented <tspan font-family="monospace">issue_refund()</tspan></text>
        </g>

        <!-- 5. Agent Action 4: Change Guard Postflight -->
        <g transform="translate(0, 234)">
          <rect width="430" height="74" rx="6" fill="#161b22" stroke="#238636" stroke-width="1.2"/>
          <rect x="8" y="8" width="158" height="18" rx="3" fill="url(#mcp-badge-grad)" stroke="#8957e5" stroke-opacity="0.5"/>
          <text x="14" y="21" fill="#d2a8ff" font-size="9.5" font-family="monospace">MCP: engram_validate_change</text>
          <text x="174" y="21" fill="#8b949e" font-size="10">Contract: ctr_829104</text>
          <rect x="12" y="34" width="406" height="28" rx="4" fill="#238636" fill-opacity="0.2"/>
          <text x="24" y="52" fill="#3fb950" font-size="12" font-weight="bold">✅ PASS — All diffs within contract boundaries (0 violations)</text>
        </g>

        <!-- 6. Agent Summary Message -->
        <g transform="translate(0, 316)">
          <rect width="430" height="88" rx="6" fill="url(#agent-bubble-grad)" stroke="#30363d"/>
          <text x="12" y="22" fill="#58a6ff" font-size="11" font-weight="600">🤖 AI Agent Response:</text>
          <text x="12" y="42" fill="#c9d1d9" font-size="11">"I have added `issue_refund()` to `BillingService`."</text>
          <text x="12" y="60" fill="#8b949e" font-size="10.5">• Complied with rule RULE-014: emits audit events</text>
          <text x="12" y="76" fill="#8b949e" font-size="10.5">• Preflight &amp; postflight validated by Engram Change Guard</text>
        </g>

        <!-- Chat Input Field Mockup -->
        <g transform="translate(0, 420)">
          <rect width="430" height="52" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
          <text x="14" y="30" fill="#8b949e" font-size="12">Ask follow-up or press Cmd+Enter to accept changes...</text>
        </g>
      </g>
    </g>
  </g>
</svg>
