name: Engram Change Guard

on:
  pull_request:
    branches: [ main, Development ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  change-guard:
    name: Enforce Change Boundaries & Constitution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history recommended for baseline diff

      - name: Checkout Trusted Action Definition
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.base_ref || github.ref_name }}
          path: .trusted-action

      - name: Run Engram Change Guard
        uses: ./.trusted-action
        with:
          base-ref: ${{ github.base_ref || 'main' }}
          strict: false
          allow-no-contract: true
          check-provenance: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
