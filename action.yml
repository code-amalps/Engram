name: "Engram Change Guard"
description: "Enforce Change Contracts, module boundaries, and Project Constitution rules on Pull Requests"
author: "code-amalps"
branding:
  icon: "shield"
  color: "purple"

inputs:
  base-ref:
    description: "Base branch or revision to diff against (e.g. main)"
    required: false
    default: "main"
  contract-id:
    description: "Explicit Change Contract ID to verify against"
    required: false
    default: ""
  contract-file:
    description: "Path to a standalone Change Contract JSON file"
    required: false
    default: ""
  strict:
    description: "Block PR on unexpected module files or missing expected files"
    required: false
    default: "false"
  allow-no-contract:
    description: "Run Project Constitution rule checks even when no contract is found"
    required: false
    default: "true"
  check-provenance:
    description: "Require human ratification if contract boundary was expanded in PR"
    required: false
    default: "true"
  version:
    description: "Engram binary release tag to install"
    required: false
    default: "v1.3.0"
  github-token:
    description: "GitHub Token for authenticated API downloads and annotations"
    required: false
    default: "${{ github.token }}"

outputs:
  status:
    description: "Guard verification status (PASSED or FAILED)"
    value: "${{ steps.run-guard.outputs.status }}"
  exit-code:
    description: "Verification exit code"
    value: "${{ steps.run-guard.outputs.exit_code }}"

runs:
  using: "composite"
  steps:
    - name: Ensure Git History Available
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        if [ -d ".git" ]; then
          # Validate and sanitize base-ref
          if [[ "$BASE_REF" =~ [^a-zA-Z0-9_./\-] ]]; then
            echo "::error::Invalid base-ref '$BASE_REF'. Must only contain alphanumeric characters, dots, slashes, underscores, and hyphens."
            exit 1
          fi

          FETCH_TARGET="$BASE_REF"
          if [[ "$FETCH_TARGET" =~ ^origin/ ]]; then
            FETCH_TARGET="${FETCH_TARGET#origin/}"
          fi

          echo "Fetching base ref origin/$FETCH_TARGET to prevent shallow clone truncation..."
          git fetch origin "$FETCH_TARGET" --depth=100 2>/dev/null || true
        fi

    - name: Install Engram Binary
      shell: bash
      env:
        ENGRAM_VERSION: ${{ inputs.version }}
        ENGRAM_AUTH_TOKEN: ${{ inputs.github-token }}
      run: |
        if command -v engram >/dev/null 2>&1; then
          echo "Engram already present in PATH: $(which engram)"
          engram --version
          exit 0
        fi

        echo "Installing Engram $ENGRAM_VERSION..."
        if [ -f "./install.sh" ]; then
          GITHUB_TOKEN="$ENGRAM_AUTH_TOKEN" ./install.sh --tag "$ENGRAM_VERSION"
        else
          curl -fsSL https://raw.githubusercontent.com/code-amalps/Engram/main/install.sh | GITHUB_TOKEN="$ENGRAM_AUTH_TOKEN" sh -s -- --tag "$ENGRAM_VERSION"
        fi

        # Add default installation locations to PATH
        if [ -d "$HOME/.local/bin" ]; then
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
        fi
        if [ -d "$HOME/bin" ]; then
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
        fi

    - name: Execute Engram Change Guard Check
      id: run-guard
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_CONTRACT_ID: ${{ inputs.contract-id }}
        INPUT_CONTRACT_FILE: ${{ inputs.contract-file }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_ALLOW_NO_CONTRACT: ${{ inputs.allow-no-contract }}
        INPUT_CHECK_PROVENANCE: ${{ inputs.check-provenance }}
      run: |
        # 1. Validate base-ref input against shell injection
        if [[ "$INPUT_BASE_REF" =~ [^a-zA-Z0-9_./\-] ]]; then
          echo "::error::Invalid base-ref '$INPUT_BASE_REF'. Contains disallowed characters."
          exit 1
        fi

        # 2. Normalize base ref: commit SHA, origin/ prefix, or branch name
        TARGET_BASE="$INPUT_BASE_REF"
        if [[ ! "$TARGET_BASE" =~ ^[0-9a-fA-F]{40}$ ]] && [[ ! "$TARGET_BASE" =~ ^origin/ ]] && [[ "$TARGET_BASE" != "HEAD" ]] && [[ "$TARGET_BASE" != "WORKTREE" ]]; then
          TARGET_BASE="origin/$TARGET_BASE"
        fi

        # 3. Construct arguments safely as a bash array (zero eval!)
        ARGS=("contract" "check" "--base" "$TARGET_BASE")

        if [ -n "$INPUT_CONTRACT_FILE" ]; then
          ARGS+=("--file" "$INPUT_CONTRACT_FILE")
        elif [ -n "$INPUT_CONTRACT_ID" ]; then
          ARGS+=("$INPUT_CONTRACT_ID")
        fi

        if [ "$INPUT_STRICT" = "true" ]; then
          ARGS+=("--strict")
        fi

        if [ "$INPUT_ALLOW_NO_CONTRACT" = "true" ]; then
          ARGS+=("--allow-no-contract")
        fi

        if [ "$INPUT_CHECK_PROVENANCE" = "true" ]; then
          ARGS+=("--check-provenance")
        fi

        echo "Executing: engram ${ARGS[*]}"
        set +e
        engram "${ARGS[@]}"
        EXIT_CODE=$?
        set -e

        if [ $EXIT_CODE -eq 0 ]; then
          echo "status=PASSED" >> "$GITHUB_OUTPUT"
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          echo "✅ Engram Change Guard: Passed"
        else
          echo "status=FAILED" >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "::error::Engram Change Guard verification failed (Exit code: $EXIT_CODE)"
          exit $EXIT_CODE
        fi
