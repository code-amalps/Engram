name: Engram Change Guard

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  change-guard:
    name: Enforce Change Boundaries & Constitution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history recommended for baseline diff

      - name: Run Engram Change Guard
        uses: code-amalps/Engram@v1.4.0
        with:
          base-ref: ${{ github.base_ref }}
          strict: false
          allow-no-contract: true
          check-provenance: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
