[package]
name = "engram"
version = "0.1.0"
edition = "2024"
description = "Local engineering memory and change intelligence for coding agents"
license = "AGPL-3.0-or-later"

[lib]
name = "engram"
path = "src/lib.rs"

[[bin]]
name = "engram"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
uuid = { version = "1.11", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
